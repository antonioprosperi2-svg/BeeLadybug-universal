<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeLadybug — CanvasAdapter</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0e;
            color: #f1f2f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        main {
            margin: 0;
            padding: 28px 24px 48px 400px;
        }
        h1 {
            color: #ff4757;
            font-size: 1.7rem;
            margin: 0 0 0.4rem;
        }
        .lede {
            color: #a4b0be;
            margin: 0 0 1.2rem;
            max-width: 58ch;
        }
        canvas {
            display: block;
            background: #1e1e24;
            border: 1px solid #2f3542;
            max-width: 100%;
            height: auto;
        }
        .hint { color: #747d8c; font-size: 0.92rem; margin-top: 1rem; }
        kbd {
            background: #2f3542;
            color: #fff;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85em;
        }
        code { color: #ffd36a; }
        a { color: #6ee7ff; }
        .swatch { display: inline-block; width: 8px; height: 8px; margin: 0 4px 0 10px; }
        .swatch.ok { background: #3dff6a; }
        .swatch.hit { background: #ff3b3b; }
        .swatch.npc { background: #e67e22; }
    </style>
</head>
<body>
    <main>
        <h1>CanvasAdapter</h1>
        <p class="lede">
            Il gioco disegna quadrati. L'adapter legge le hitbox, calcola le
            collisioni e manda pacchetti al Core. Il Core non sa che esiste un canvas.
            <span class="swatch ok"></span>ok
            <span class="swatch hit"></span>collide
            <span class="swatch npc"></span>patrol
        </p>
        <canvas id="appCanvas" width="800" height="420"></canvas>
        <p class="hint">
            Muovi il mouse sul canvas. <kbd>F2</kbd> overlay+hitbox ·
            <kbd>F3</kbd> slow · <kbd>F4</kbd> freeze.
            Core puro: <a href="./examples/core.html">sandbox</a> ·
            DOM: <a href="./examples/dom.html">WebDOMAdapter</a>
        </p>
    </main>
    <script type="module" src="./examples/canvas-sandbox.js"></script>
</body>
</html>
